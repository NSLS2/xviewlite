[workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[dependencies]
python = ">=3.10"


[pypi-dependencies]
pyqt5 = "*"
pyqtgraph = "*"
setuptools = "<82"
xviewlite = { path = ".", editable = false }
xas = { git = "https://github.com/NSLS-II-ISS/xas" }
xraylarch = { extras = ["larix"] }

[tasks]
xviewlite = "python xviewlite/xview.py"


[feature.dev.pypi-dependencies]
xviewlite = { path = ".", editable = false, extras = ["dev"] }

[feature.dev.tasks]
lint = "coverage run -m pytest && coverage report -m && codecov && flake8"
docs = { cmd = "make -C docs html", depends-on = ["lint"] }
